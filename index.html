<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировки">

<link rel="icon" href="icon-180.png">
<title>Журнал тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: одна колонка до 720px, нижняя навигация, аккордеон упражнений, поля ввода с подписями колонок.
   Skins: три оформления на выбор, переключаются в любой момент (атрибут data-skin на корне).
   Clean: светлое, мягкие скругления, синий акцент (в духе Apple Fitness и Hevy).
   Midnight: тёмное OLED, мятный акцент (в духе Whoop и Strong).
   Volt: белое, чёрное и кислотный жёлто-зелёный, острые углы, капслок (в духе Nike Training Club). */
/* общие токены оформления: у Midnight остаются плоскими, остальные темы их переопределяют */
:root {
  --bg-img: none; --btn-bg: var(--accent); --btn-sh: none; --card-sh: var(--shadow); --card-bd: var(--line); --card-bw: 1px;
  --nav-bg: var(--surface); --nav-bd: var(--line); --nav-ink: var(--muted); --nav-on: var(--accent); --nav-on-bg: var(--accent-soft);
  --ex-ring: none; --p25: #C8372D; --p20: #2456C9; --p15: #E2B714; --p10: #2E9A5B; --p5: #F2F2F2; --p2: #2B3036; --p1: #9AA3AD;
  --font-display: "Fira Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --brand-c: var(--ink); --clock-c: var(--accent); --chip-bd: transparent;
}
:root[data-skin="clean"] {
  --bg: #ECEAF8; --surface: #FFFFFF; --surface-2: #EEEDF9; --ink: #15122B; --ink-2: #413D5C; --muted: #6A6685; --line: #E4E2F1;
  --accent: #5B45F0; --accent-ink: #FFFFFF; --accent-soft: rgba(91, 69, 240, 0.10);
  --good: #0E7C4A; --good-soft: rgba(14, 124, 74, 0.12); --warn: #8A5200; --warn-soft: rgba(138, 82, 0, 0.13); --bad: #B3261E; --bad-soft: rgba(179, 38, 30, 0.11);
  --r: 20px; --r-sm: 14px; --h-tt: none; --h-ls: 0; --shadow: 0 1px 2px rgba(40, 30, 110, 0.05), 0 8px 24px rgba(40, 30, 110, 0.07);
  --bg-img: radial-gradient(900px 420px at 100% -80px, rgba(139, 92, 246, 0.26), transparent 60%), radial-gradient(700px 380px at -10% 0, rgba(56, 189, 248, 0.22), transparent 60%);
  --btn-bg: linear-gradient(135deg, #5B45F0 0%, #8B5CF6 100%); --btn-sh: 0 6px 16px rgba(91, 69, 240, 0.32);
  --card-bd: rgba(91, 69, 240, 0.10); --nav-bg: rgba(255, 255, 255, 0.82); --nav-bd: rgba(91, 69, 240, 0.10);
  --ex-ring: 0 0 0 2px rgba(91, 69, 240, 0.45), 0 10px 28px rgba(91, 69, 240, 0.16);
  --brand-c: #5B45F0; --clock-c: #5B45F0;
  --p25: #D9442F; --p20: #5B45F0; --p15: #E8A317; --p10: #17A05F; --p5: #F2F2F2; --p2: #2B2840; --p1: #9A97B3;
  color-scheme: light;
}
:root[data-skin="midnight"] {
  --bg: #000000; --surface: #111317; --surface-2: #1C1F26; --ink: #F4F5F7; --ink-2: #C5CAD3; --muted: #8B93A1; --line: #23272F;
  --accent: #35D9A5; --accent-ink: #02150E; --accent-soft: rgba(53, 217, 165, 0.16);
  --good: #6FD99B; --good-soft: rgba(111, 217, 155, 0.15); --warn: #F0B454; --warn-soft: rgba(240, 180, 84, 0.16); --bad: #FF8A80; --bad-soft: rgba(255, 138, 128, 0.15);
  --r: 14px; --r-sm: 10px; --h-tt: none; --h-ls: 0.01em; --shadow: none; --p5: #E6E8EA; --p2: #3A424B;
  color-scheme: dark;
}
:root[data-skin="volt"] {
  --bg: #F7F7F1; --surface: #FFFFFF; --surface-2: #EDEDE4; --ink: #0A0A0A; --ink-2: #2E2E2B; --muted: #585853; --line: #0A0A0A;
  --accent: #0A0A0A; --accent-ink: #DDFF3C; --accent-soft: #DDFF3C;
  --good: #0B7A3E; --good-soft: rgba(11, 122, 62, 0.14); --warn: #8A5200; --warn-soft: rgba(138, 82, 0, 0.15); --bad: #B3261E; --bad-soft: rgba(179, 38, 30, 0.12);
  --r: 6px; --r-sm: 4px; --h-tt: uppercase; --h-ls: 0.03em; --shadow: 4px 4px 0 #0A0A0A;
  --card-bw: 2px; --card-bd: #0A0A0A; --btn-sh: 3px 3px 0 #DDFF3C; --chip-bd: #0A0A0A;
  --nav-bg: #0A0A0A; --nav-bd: #0A0A0A; --nav-ink: #A6A69E; --nav-on: #0A0A0A; --nav-on-bg: #DDFF3C;
  --ex-ring: 6px 6px 0 #DDFF3C, 6px 6px 0 2px #0A0A0A; --brand-c: #0A0A0A; --clock-c: #0A0A0A;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg); background-image: var(--bg-img); background-repeat: no-repeat; background-attachment: fixed; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 150px; font-variant-numeric: tabular-nums;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: var(--h-ls); text-transform: var(--h-tt); text-wrap: balance; overflow-wrap: anywhere; }
h1 { font-size: 30px; line-height: 1.1; font-weight: 700; }
h2 { font-size: 20px; font-weight: 600; margin-top: 8px; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 10px; }
.top-r { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.skinbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.skinbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#skins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.skin { font: inherit; text-align: left; cursor: pointer; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: var(--r); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.skin[aria-pressed="true"] { border-color: var(--accent); }
.skin b { font-family: var(--font-display); font-size: 15px; line-height: 1.1; }
.skin span.d { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.sw { display: flex; height: 28px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(127, 127, 127, 0.35); }
.sw i { flex: 1; }
.brand img { width: 26px; height: 26px; border-radius: 7px; margin-right: 8px; vertical-align: -7px; }
.brand { color: var(--brand-c); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sync { cursor: pointer; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
@media (max-width: 399px) { .sync { font-size: 0; gap: 0; } }
.sync::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--good); }
.sync[data-s="err"]::before { background: var(--bad); }
#app { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: var(--card-bw) solid var(--card-bd); box-shadow: var(--card-sh); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.clock { font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1; color: var(--clock-c); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-family: var(--font-display); font-size: clamp(20px, 6.2vw, 26px); font-weight: 600; line-height: 1.05; white-space: nowrap; }
.tile span { font-size: 12px; color: var(--muted); }
.btn { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--btn-bg); color: var(--accent-ink); border-color: transparent; box-shadow: var(--btn-sh); }
:root[data-skin="volt"] .btn.primary { border-color: #0A0A0A; }
.btn:active { transform: translateY(1px); }
.btn.primary:hover { filter: brightness(1.08); background: var(--btn-bg); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.wide { width: 100%; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { border: 1px solid var(--chip-bd); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--btn-bg); }
:root[data-skin="volt"] .bar { border: 2px solid #0A0A0A; border-radius: 3px; } :root[data-skin="volt"] .bar i { background: #DDFF3C; border-right: 2px solid #0A0A0A; border-radius: 0; }
.spark { width: 100%; height: 56px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.bdg { display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); opacity: 0.55; min-width: 0; }
.bdg.on { opacity: 1; background: var(--accent-soft); }
.bdg b { font-size: 20px; color: var(--accent); } .bdg span { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; } .bdg small { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
:root[data-skin="volt"] .bdg { border: 2px solid #0A0A0A; border-radius: 4px; } :root[data-skin="volt"] .bdg b { color: #0A0A0A; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.target { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.target .big { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set, .sethead { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px 28px; gap: 8px; align-items: center; }
.sethead span { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.2; }
@media (max-width: 359px) {
  .set, .sethead { grid-template-columns: 20px minmax(0, 1fr) minmax(0, 1fr) 44px 22px; gap: 6px; }
  .chk { width: 44px; height: 44px; }
  .fld input { font-size: 20px; }
  .ico { width: 22px; }
  .card { padding: 12px; }
  .btn { padding: 0 12px; }
}
.set .n { font-family: var(--font-display); font-weight: 600; color: var(--muted); font-size: 18px; text-align: center; }
.set .n.wu { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipb { font: inherit; font-size: 13px; font-weight: 600; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chipb[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.how summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); min-height: 32px; display: flex; align-items: center; }
.how p { margin: 4px 0 8px; font-size: 14px; color: var(--ink-2); }
:root[data-skin="volt"] .chipb { border: 2px solid #0A0A0A; border-radius: 4px; } :root[data-skin="volt"] .chipb[aria-pressed="true"] { background: #DDFF3C; }
.stp { display: grid; grid-template-columns: 1fr minmax(0, 1.2fr) 1fr; gap: 8px; align-items: center; padding: 6px; border-radius: var(--r-sm); background: var(--surface-2); }
.stp button { font: 600 22px var(--font-display); min-height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; touch-action: manipulation; }
.stp button:active { background: var(--accent-soft); }
.stp span { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.2; }
:root[data-skin="volt"] .stp { border: 2px solid #0A0A0A; background: #DDFF3C; }
:root[data-skin="volt"] .stp button { border: 2px solid #0A0A0A; }
:root[data-skin="volt"] .stp span { color: #0A0A0A; }
.fld { position: relative; min-width: 0; }
.fld input { width: 100%; height: 48px; font: 600 22px var(--font-display); text-align: center; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: var(--r-sm); padding: 0 4px; -moz-appearance: textfield; appearance: textfield; }
.fld input::-webkit-outer-spin-button, .fld input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set.wu .fld input { font-weight: 500; color: var(--ink-2); }
.set.done .fld input { background: var(--accent-soft); border-color: transparent; }
.chk { width: 48px; height: 48px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.set.done .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chk svg { width: 24px; height: 24px; }
.ico { width: 28px; height: 40px; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0; }
.ico:hover { color: var(--bad); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input[type="text"], .field input[type="number"], .field input[type="email"], .field input[type="password"], .field select, textarea {
  font: inherit; font-size: 16px; min-height: 44px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0;
}
textarea { padding: 10px; min-height: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.sethist { display: flex; flex-wrap: wrap; gap: 6px; }
.sethist .chip { background: var(--bg); border: 1px solid var(--line); font-family: var(--font-display); font-size: 15px; }
.sethist .chip.wu { color: var(--muted); font-weight: 500; }
.verdict { font-size: 17px; line-height: 1.4; }
.divider { height: 1px; background: var(--line); }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--ink-2); }
.list-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.list-item:hover { background: var(--surface-2); }
.list-item .t { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.arrow-up { color: var(--good); } .arrow-down { color: var(--warn); }
.chart { width: 100%; overflow: hidden; }
.chart svg { display: block; width: 100%; height: auto; }
.axis text { fill: var(--muted); font: 11px var(--font-body); }
.axis line { stroke: var(--line); }
.val { fill: var(--ink); font: 700 13px var(--font-display); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--accent); }
.legend i.b { background: var(--muted); }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
/* упражнение в тренировке */
.ex { padding: 0; gap: 0; overflow: hidden; scroll-margin-top: 8px; }
.ex.open { border-color: var(--accent); box-shadow: var(--ex-ring); }
.xhead { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; border: 0; padding: 12px 14px; min-height: 64px; cursor: pointer; }
.xhead:hover { background: var(--surface-2); }
.xhead .nm { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.2; }
.xhead .tg { font-size: 13px; color: var(--muted); }
.xhead .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dots { display: flex; gap: 4px; flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dot.wu { border-radius: 2px; }
.dot.on { background: var(--accent); border-color: var(--accent); }
.chev { flex: none; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform 0.15s; }
.ex.open .chev { transform: rotate(180deg); }
.xbody { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
#restbar {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 19;
  max-width: 696px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 10px 12px 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "lbl time" "btns btns"; gap: 8px 12px; align-items: center;
}
#restbar .rl { grid-area: lbl; min-width: 0; }
#restbar .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; opacity: 0.7; font-weight: 600; }
#restbar .rn { font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
#restbar .time { grid-area: time; font-family: var(--font-display); font-size: 40px; font-weight: 600; line-height: 1; text-align: right; }
#restbar .rb { grid-area: btns; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
#restbar .rb.one { grid-template-columns: 1fr; }
#restbar button { font: inherit; font-weight: 600; font-size: 14px; min-height: 40px; padding: 0 8px; border-radius: var(--r-sm); border: 1px solid rgba(127, 127, 127, 0.55); background: transparent; color: inherit; cursor: pointer; }
body.resting { padding-block-end: 250px; }
[hidden] { display: none !important; }
#restbar[hidden] { display: none; }

/* тонкая доработка тем */
:root[data-skin="volt"] .tile { border: 2px solid #0A0A0A; background: var(--surface); }
:root[data-skin="volt"] .tile b { font-size: clamp(22px, 7vw, 30px); }

:root[data-skin="volt"] .fld input, :root[data-skin="volt"] .chk, :root[data-skin="volt"] .field input, :root[data-skin="volt"] .field select, :root[data-skin="volt"] textarea, :root[data-skin="volt"] .btn { border-width: 2px; border-color: #0A0A0A; }
:root[data-skin="volt"] .btn.danger { border-color: var(--bad); }
:root[data-skin="volt"] .list-item { border-width: 2px; box-shadow: 3px 3px 0 #0A0A0A; }

@media (max-width: 359px) { :root[data-skin="volt"] #nav button { font-size: 10px; letter-spacing: 0; } }
:root[data-skin="volt"] .dot.on { background: #0A0A0A; }

:root[data-skin="clean"] h1 { background: linear-gradient(135deg, #15122B 30%, #5B45F0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

.drow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }

.chev svg { width: 22px; height: 22px; }
.card.ex.fin { border-color: var(--good); }

.card.ex[open], .card.ex:has(.sets) { gap: 12px; }

.chip.wchip { color: var(--warn); }

.rtn { font-family: var(--font-display); color: var(--muted); font-weight: 600; }
.rtname { min-width: 0; overflow-wrap: anywhere; }
.pre { white-space: pre-wrap; margin: 0; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); padding: 10px; border-radius: var(--r-sm); overflow-x: auto; }

        '<button class="ico" data-act="delset" data-e="' + ei + '" data-i="' + i + '" aria-label="Удалить подход ' + (i + 1) + '">×</button></div>';
    }).join('');
    var last = e.id ? lastLine(e) : null, wlab = wtLabel(e);
    return '<section class="card ex' + (all ? ' fin' : '') + '">' + head +
      '<div class="stack" style="gap:4px"><div class="target"><span class="hint">Цель</span><span class="big">' + esc(tgtText(e, { top: top, r: t.r })) + '</span>' + (e.bar ? platesHTML(top) : '') + '</div>' +
      (howFor(e) ? '<details class="how"><summary>Как делать</summary><p>' + esc(howFor(e)) + '</p></details>' : '') + '<p class="hint">' + esc(t.reason || '') + '</p>' + (last ? '<p class="hint">В прошлый раз (рабочие): ' + esc(last) + '</p>' : '') + (wlab ? '<p class="hint">' + esc(wlab) + '</p>' : '') + (e.note ? '<p class="hint">' + esc(e.note) + '</p>' : '') + '</div>' +
      '<div class="sets"><div class="sethead"><span></span><span>' + wHead + '</span><span>' + rHead + '</span><span></span><span></span></div>' + rows + '</div><div class="row"><button class="btn small" data-act="addset" data-e="' + ei + '">+ Подход</button><button class="btn small" data-act="delentry" data-e="' + ei + '">Убрать из тренировки</button></div></section>';
  }
  function liveStats() {
    var done = 0, total = 0, vol = 0;
    state.active.entries.forEach(function (en) { total += en.sets.length; done += en.sets.filter(isDone).length; vol += entryVol(en); });

  }
  function activeHTML() {
    var a = state.active, ls = liveStats(), used = a.entries.map(function (e) { return e.ex; });

      '<div class="tiles"><div class="tile"><b id="lsets">' + ls.done + ' из ' + ls.total + '</b><span>подходов</span></div><div class="tile"><b id="lvol">' + fmt(Math.round(ls.vol)) + '</b><span>рабочий объём, кг</span></div></div>' +
      '<p class="hint">Упражнения можно делать в любом порядке: открывай нужную карточку, отмечай подход и переходи к другой. Первый подход — разминка (Р), он входит в общее число подходов.</p>' +
      a.entries.map(entryHTML).join('') +
      (avail.length ? '<div class="card"><div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label for="addEx">Добавить упражнение</label><select id="addEx">' + avail.map(function (e) { return '<option value="' + e.id + '">' + esc(e.name) + '</option>'; }).join('') + '</select></div><button class="btn" data-act="addex" style="align-self:flex-end">Добавить</button></div></div>' : '') +
      (conf || '<div class="row"><button class="btn primary" style="flex:1" data-act="finish">Завершить тренировку</button><button class="btn danger" data-act="discard">Отменить</button></div>');
  }

  /* ---------- итоги ---------- */
  function setChips(i) {
    return i.sets.map(function (x) { return '<span class="chip' + (x.warm ? ' wchip' : '') + '">' + (x.warm ? 'Р ' : '') + (i.e.kind === 'bw' ? '' : fmt(x.w) + ' × ') + x.r + '</span>'; }).join('');
  }
  function summaryHTML(s, mode) {
    var A = analyze(s);
    var verdict = 'Цель выполнена в ' + A.met + ' из ' + A.items.length + ' ' + plural(A.items.length, ['упражнения', 'упражнений', 'упражнений']) + '.';
    if (A.prs) verdict += ' Новых рекордов: ' + A.prs + '.';
    var ups = A.items.filter(function (i) { return i.next && i.next.top > i.base && i.e.kind !== 'bw'; }).length;
    if (ups) verdict += ' Вес растёт в ' + ups + ' ' + plural(ups, ['упражнении', 'упражнениях', 'упражнениях']) + '.';
    var cmp;
    if (A.prevVol) { var d = (A.vol - A.prevVol) / A.prevVol * 100; cmp = '<p class="hint">Рабочий объём ' + (d >= 0 ? 'выше' : 'ниже') + ' прошлой тренировки «' + esc(A.prevSame.name) + '» на ' + fmt(Math.abs(Math.round(d * 10) / 10)) + '% (было ' + volTxt(A.prevVol) + '). Разминочные подходы в объём не входят.</p>'; }
    else cmp = '<p class="hint">Раньше такой тренировки не было, сравнивать пока не с чем. Разминочные подходы в объём не входят.</p>';
    var cards = A.items.map(function (i) {
      var full = i.metN >= i.need, tag = full ? '<span class="chip good">Цель выполнена</span>' : (i.metN > 0 ? '<span class="chip warn">' + i.metN + ' из ' + i.need + ' подходов по цели</span>' : '<span class="chip bad">Ниже цели</span>');
      var pr = (i.prW ? '<span class="chip acc">Рекорд веса: ' + wl(i.e, i.maxW) + '</span>' : '') + (i.prE ? '<span class="chip acc">' + (i.e.kind === 'bw' ? 'Рекорд повторов: ' + i.maxM : 'Рекорд расчётного 1ПМ: ' + fmt(Math.round(i.maxM * 10) / 10) + ' кг') + '</span>' : '');
      var nx = '';
      if (i.next) {
        var dir = i.e.kind !== 'bw' && i.next.top > i.base ? '<span class="arrow-up">↑</span>' : i.e.kind !== 'bw' && i.next.top < i.base ? '<span class="arrow-down">↓</span>' : '→';
        nx = '<div class="divider"></div><div class="stack" style="gap:2px"><span class="hint">Следующая цель</span><div class="target"><span class="big">' + dir + ' ' + esc(tgtText(i.e, i.next)) + '</span></div><p class="hint">' + esc(i.next.reason) + '</p></div>';
      }
      return '<section class="card"><div class="row"><h3>' + esc(i.e.name) + '</h3>' + tag + '</div><div class="sethist">' + setChips(i) + '</div>' +
        '<p class="hint">Цель была ' + esc(tgtText(i.e, { top: i.top, r: i.t.r })) + '. Рабочий объём: ' + volTxt(i.vol) + '.</p>' + (pr ? '<div class="chips">' + pr + '</div>' : '') + nx + '</section>';
    }).join('');
    var back = mode === 'fresh' ? '<button class="btn primary wide" data-act="summary-close">Готово</button>' :
      (ui.confirm === 'del:' + s.id ? '<div class="card"><h3>Удалить тренировку из истории?</h3><p>Цели по упражнениям пересчитаются без неё.</p><div class="row"><button class="btn danger solid" data-act="hist-del-ok" data-id="' + s.id + '">Удалить</button><button class="btn" data-act="confirm-no">Оставить</button></div></div>' :
        '<div class="row"><button class="btn" data-act="hist-back">← К истории</button><button class="btn danger" data-act="hist-del" data-id="' + s.id + '">Удалить</button></div>');

      '<div class="tiles">' + tile(A.mins + ' мин', 'длительность') + tile(volTxt(A.vol), 'рабочий объём') + tile(A.sets, 'подходов') + tile(A.reps, 'повторов') + '</div>' +
      '<h2>По упражнениям</h2>' + cards + back;
  }
  function historyHTML() {
    if (ui.histOpen) { var s = state.sessions.find(function (x) { return x.id === ui.histOpen; }); if (s) return summaryHTML(s, 'hist'); ui.histOpen = null; }
    var list = state.sessions.slice().reverse();
    if (!list.length) return '<h1>История</h1><div class="empty"><p>Здесь появятся завершённые тренировки с итогами и целями на следующий раз.</p></div>';

    }).join('');
  }

  /* ---------- прогресс ---------- */
  function niceStep(x) { var p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
  function lineChart(pts, W, unit) {
    var H = 220, L = 40, R = 14, T = 22, B = 26, n = pts.length;
    var all = [].concat(pts.map(function (p) { return p.a; }), pts.map(function (p) { return p.b; }));
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    var step = niceStep(Math.max((hi - lo) / 4, 1)), y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step; if (y1 === y0) y1 = y0 + step;
    var X = function (i) { return n === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (n - 1); };
    var Y = function (v) { return T + (H - T - B) * (1 - (v - y0) / (y1 - y0)); };
    var g = '', t;
    for (t = y0; t <= y1 + 1e-9; t += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text x="' + (L - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + fmt(Math.round(t * 10) / 10) + '</text>';
    var every = Math.ceil(n / 6), xl = '';
    pts.forEach(function (p, i) { if (i % every === 0 || i === n - 1) xl += '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="' + (n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' + p.label + '</text>'; });
    var line = function (k) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[k]).toFixed(1); }).join(' '); };
    var area = n > 1 ? '<path d="' + line('a') + ' L' + X(n - 1) + ' ' + Y(y0) + ' L' + X(0) + ' ' + Y(y0) + ' Z" fill="var(--accent-soft)" stroke="none"/>' : '';
    var dots = pts.map(function (p, i) { return '<circle cx="' + X(i) + '" cy="' + Y(p.a) + '" r="' + (i === n - 1 ? 5 : 3.2) + '" fill="var(--accent)"/>'; }).join('');
    var lp = pts[n - 1];
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="График прогресса"><g class="axis">' + g + xl + '</g>' + area +
      (n > 1 ? '<path d="' + line('b') + '" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><path d="' + line('a') + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>' : '') + dots +
      '<text class="val" x="' + X(n - 1) + '" y="' + (Y(lp.a) - 10) + '" text-anchor="' + (n === 1 ? 'middle' : 'end') + '">' + fmt(lp.a) + ' ' + unit + '</text></svg>';
  }
  function weekStart(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
  function barChart(W) {
    var H = 190, L = 8, R = 8, T = 24, B = 26, weeks = [], cur = weekStart(Date.now()), i;
    for (i = 7; i >= 0; i--) { var d = new Date(cur); d.setDate(d.getDate() - 7 * i); weeks.push({ t: d.getTime(), v: 0 }); }
    state.sessions.forEach(function (s) {
      var w = weeks.find(function (x) { var e = new Date(x.t); e.setDate(e.getDate() + 7); return s.start >= x.t && s.start < e.getTime(); });
      if (w) w.v += sessVol(s);
    });
    var mx = Math.max.apply(null, weeks.map(function (w) { return w.v; })) || 1, bw = (W - L - R) / 8, out = '';
    weeks.forEach(function (w, k) {
      var h = (H - T - B) * w.v / mx, x = L + bw * k + bw * 0.14, ww = bw * 0.72, y = H - B - h;
      out += '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="' + Math.max(h, w.v ? 2 : 0) + '" rx="3" fill="' + (k === 7 ? 'var(--accent)' : 'var(--muted)') + '" opacity="' + (k === 7 ? 1 : 0.45) + '"/>' +
        (w.v ? '<text class="val" x="' + (x + ww / 2) + '" y="' + (y - 5) + '" text-anchor="middle" style="font-size:11px">' + (w.v >= 1000 ? fmt(Math.round(w.v / 100) / 10) + 'т' : Math.round(w.v)) + '</text>' : '') +
        '<text x="' + (x + ww / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + dFmt(w.t, { day: 'numeric', month: 'numeric' }) + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Объём по неделям"><g class="axis">' + out + '</g></svg>';
  }
  function progressCore() {
    if (!state.sessions.length) return '<h1>Прогресс</h1><div class="empty"><p>Графики и рекорды появятся после первой завершённой тренировки.</p></div>';
    var W = Math.max(260, Math.min(window.innerWidth, 720) - 32 - 30);
    var withHist = state.exercises.filter(function (e) { return histFor(e.id, state.sessions).length; });
    if (!ui.progEx || !withHist.some(function (e) { return e.id === ui.progEx; })) ui.progEx = withHist.length ? withHist[0].id : null;
    var since = Date.now() - 30 * 864e5, recent = state.sessions.filter(function (s) { return s.start >= since; });
    var prs = sum(recent.map(function (s) { return analyze(s).prs; }));
    var wkVol = sum(state.sessions.filter(function (s) { return s.start >= weekStart(Date.now()); }).map(sessVol));
    var chart = '';

      var pts = h.map(function (x) {
        var w = work(x);
        return { label: dFmt(x.s.start, { day: 'numeric', month: 'numeric' }),
          a: bw ? Math.round(sum(w.map(function (y) { return y.r; })) / w.length * 10) / 10 : Math.max.apply(null, w.map(function (y) { return y.w; })),
          b: bw ? Math.max.apply(null, w.map(function (y) { return y.r; })) : Math.round(Math.max.apply(null, w.map(function (y) { return e1(y.w, y.r); })) * 10) / 10 };
      });
      var rows = h.slice(-8).reverse().map(function (x) {
        var w = work(x), ev = evalSets(e, x.sets);
        return '<tr><td>' + dFmt(x.s.start, { day: 'numeric', month: 'short' }) + '</td><td>' + (bw ? '—' : wl(e, ev.ww)) + '</td><td>' + w.map(function (y) { return y.r; }).join(' · ') + '</td><td>' + volTxt(entryVol({ sets: w, mult: e.mult })) + '</td></tr>';
      }).join('');
      var tg = targetFor(e, state.sessions);
      chart = '<div class="card"><div class="field"><label for="progEx">Упражнение</label><select id="progEx">' + withHist.map(function (x) { return '<option value="' + x.id + '"' + (x.id === ui.progEx ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="target"><span class="hint">Следующая цель</span><span class="big">' + esc(tgtText(e, tg)) + '</span></div>' +
        '<div class="legend"><span><i></i>' + (bw ? 'Среднее число повторов' : 'Рабочий максимум, кг') + '</span><span><i class="b"></i>' + (bw ? 'Лучший подход' : 'Расчётный 1ПМ (формула Эпли)') + '</span></div>' +
        '<div class="chart">' + lineChart(pts, W, unit) + '</div><div class="scroll-x"><table><thead><tr><th>Дата</th><th>Вес</th><th>Повторы</th><th>Объём</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
    }
    return '<h1>Прогресс</h1><div class="tiles">' + tile(recent.length, 'тренировок за 30 дней') + tile(volTxt(wkVol), 'объём на этой неделе') + tile(prs, 'рекордов за 30 дней') + '</div>' + chart +
      '<div class="card"><h3>Объём по неделям</h3><div class="chart">' + barChart(W) + '</div><p class="hint">Объём — сумма «вес × повторы» по рабочим подходам с понедельника. Для гантелей и односторонних упражнений учтены обе стороны.</p></div>';
  }

  /* ---------- программа: просмотр и редактирование ---------- */
  function apprEditor(e) {
    var rows = e.approaches.map(function (a, i) {
      var wi = e.kind === 'bw' ? '' : '<div class="field"><label for="ap-w-' + i + '">' + (e.kind === 'bw+' ? 'Доп. вес, кг' : 'Вес, кг') + '</label><input id="ap-w-' + i + '" type="number" min="0" step="0.5" inputmode="decimal" data-ap="' + e.id + '" data-i="' + i + '" data-k="w" value="' + a.w + '"></div>';

      return '<div class="apr"><span class="n">' + (i + 1) + '</span>' + wi + ri + '<label class="check" style="align-self:end"><input type="checkbox" data-ap="' + e.id + '" data-i="' + i + '" data-k="warm"' + (a.warm ? ' checked' : '') + '>Разминка</label><button class="ico" style="align-self:end" data-act="ap-del" data-id="' + e.id + '" data-i="' + i + '" aria-label="Удалить подход ' + (i + 1) + '">×</button></div>';

  }
  function exFormHTML(e) {
    var num = function (k, label, extra) { return '<div class="field"><label for="f-' + k + '">' + label + '</label><input id="f-' + k + '" type="number" data-fx="' + e.id + '" data-k="' + k + '" value="' + (e[k] || (k === 'minSets' ? '' : 0)) + '" ' + extra + '></div>'; };
    var opts = function (map, cur) { return Object.keys(map).map(function (k) { return '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + map[k] + '</option>'; }).join(''); };
    return '<section class="card"><div class="field"><label for="f-name">Название</label><input id="f-name" type="text" data-fx="' + e.id + '" data-k="name" value="' + esc(e.name) + '"></div>' +
      '<div class="grid2"><div class="field"><label for="f-group">Группа мышц</label><select id="f-group" data-fx="' + e.id + '" data-k="group">' + GROUPS.map(function (g) { return '<option' + (g === e.group ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="f-kind">Тип нагрузки</label><select id="f-kind" data-fx="' + e.id + '" data-k="kind">' + opts(KINDS, e.kind) + '</select></div>' +
