<title>Журнал тренировок</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: одна колонка до 720px, нижняя навигация; в тренировке упражнения идут аккордеоном, открыть можно любое.
   Palette: бетон и сталь (нейтрали с холодным уклоном), один акцент цвета 20-кг блина, семантика отдельно.
   Type: Fira Sans Condensed для заголовков и цифр (как разметка на блинах), Golos Text для текста. */
:root {
  --bg: #E7EAEE;
  --surface: #F7F8F9;
  --surface-2: #DCE1E6;
  --ink: #14181D;
  --ink-2: #39424B;
  --muted: #5F6A75;
  --line: #C8CFD6;
  --accent: #1E4FD1;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(30, 79, 209, 0.12);
  --good: #17703F;
  --good-soft: rgba(23, 112, 63, 0.13);
  --warn: #8F5200;
  --warn-soft: rgba(143, 82, 0, 0.14);
  --bad: #B3261E;
  --bad-soft: rgba(179, 38, 30, 0.12);
  --font-display: "Fira Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1215; --surface: #171C21; --surface-2: #222A31; --ink: #ECEFF2; --ink-2: #C3CAD1; --muted: #8E98A3;
    --line: #2D363F; --accent: #7BA2FF; --accent-ink: #0B1020; --accent-soft: rgba(123, 162, 255, 0.16);
    --good: #5CCB93; --good-soft: rgba(92, 203, 147, 0.15); --warn: #E3A44F; --warn-soft: rgba(227, 164, 79, 0.16);
    --bad: #FF8A80; --bad-soft: rgba(255, 138, 128, 0.15);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1215; --surface: #171C21; --surface-2: #222A31; --ink: #ECEFF2; --ink-2: #C3CAD1; --muted: #8E98A3;
  --line: #2D363F; --accent: #7BA2FF; --accent-ink: #0B1020; --accent-soft: rgba(123, 162, 255, 0.16);
  --good: #5CCB93; --good-soft: rgba(92, 203, 147, 0.15); --warn: #E3A44F; --warn-soft: rgba(227, 164, 79, 0.16);
  --bad: #FF8A80; --bad-soft: rgba(255, 138, 128, 0.15);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 150px; font-variant-numeric: tabular-nums;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.1; font-weight: 700; }
h2 { font-size: 20px; font-weight: 600; margin-top: 8px; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; text-align: right; }
.sync::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--good); }
.sync[data-s="err"]::before { background: var(--bad); }
#app { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.clock { font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1; color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.05; }
.tile span { font-size: 12px; color: var(--muted); }
.btn { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.wide { width: 100%; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.target { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.target .big { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px 32px; gap: 8px; align-items: center; }
.set .n { font-family: var(--font-display); font-weight: 600; color: var(--muted); font-size: 18px; text-align: center; }
.set .n.wu { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
.fld { position: relative; min-width: 0; }
.fld input { width: 100%; height: 48px; font: 600 22px var(--font-display); text-align: center; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 0 28px 0 4px; -moz-appearance: textfield; appearance: textfield; }
.fld input::-webkit-outer-spin-button, .fld input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.fld span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }
.set.wu .fld input { font-weight: 500; color: var(--ink-2); }
.set.done .fld input { background: var(--accent-soft); border-color: transparent; }
.chk { width: 48px; height: 48px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.set.done .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chk svg { width: 24px; height: 24px; }
.ico { width: 32px; height: 40px; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0; }
.ico:hover { color: var(--bad); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input[type="text"], .field input[type="number"], .field select, textarea {
  font: inherit; font-size: 16px; min-height: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0;
}
textarea { padding: 10px; min-height: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.sethist { display: flex; flex-wrap: wrap; gap: 6px; }
.sethist .chip { background: var(--bg); border: 1px solid var(--line); font-family: var(--font-display); font-size: 15px; }
.sethist .chip.wu { color: var(--muted); font-weight: 500; }
.verdict { font-size: 17px; line-height: 1.4; }
.divider { height: 1px; background: var(--line); }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--ink-2); }
.list-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.list-item:hover { background: var(--surface-2); }
.list-item .t { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.arrow-up { color: var(--good); } .arrow-down { color: var(--warn); }
.chart { width: 100%; overflow: hidden; }
.chart svg { display: block; width: 100%; height: auto; }
.axis text { fill: var(--muted); font: 11px var(--font-body); }
.axis line { stroke: var(--line); }
.val { fill: var(--ink); font: 700 13px var(--font-display); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--accent); }
.legend i.b { background: var(--muted); }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
/* упражнение в тренировке */
.ex { padding: 0; gap: 0; overflow: hidden; scroll-margin-top: 8px; }
.ex.open { border-color: var(--accent); }
.xhead { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; border: 0; padding: 12px 14px; min-height: 64px; cursor: pointer; }
.xhead:hover { background: var(--surface-2); }
.xhead .nm { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.2; }
.xhead .tg { font-size: 13px; color: var(--muted); }
.xhead .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dots { display: flex; gap: 4px; flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dot.wu { border-radius: 2px; }
.dot.on { background: var(--accent); border-color: var(--accent); }
.chev { flex: none; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform 0.15s; }
.ex.open .chev { transform: rotate(180deg); }
.xbody { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
/* программа */
.drow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.drow:first-of-type { border-top: 0; }
.acts { display: flex; gap: 2px; flex: none; }
.acts button { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; font-size: 16px; cursor: pointer; padding: 0; }
.acts button:hover { background: var(--surface-2); }
.acts button.x:hover { color: var(--bad); }
.prow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 0.8fr) 36px; gap: 8px; align-items: end; }
.prow select, .prow input { font: inherit; font-size: 16px; min-height: 44px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.prow .fx { visibility: hidden; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.acc { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; min-height: 44px; }
.acc h3 { overflow-wrap: anywhere; }
.prog { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 600; font-size: 16px; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.prog.ok { background: var(--good-soft); color: var(--good); }
.prog svg { width: 16px; height: 16px; }
.chev { width: 22px; height: 22px; color: var(--muted); display: inline-flex; transition: transform 0.15s; }
.chev.up { transform: rotate(180deg); }
.chev svg { width: 22px; height: 22px; }
.card.ex.fin { border-color: var(--good); }
.card.ex { gap: 8px; }
.card.ex[open], .card.ex:has(.sets) { gap: 12px; }
.bwtag { height: 48px; display: grid; place-items: center; font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
.set.warm .n { color: var(--warn); font-size: 15px; background: var(--warn-soft); border-radius: 6px; line-height: 28px; }
.chip.wchip { color: var(--warn); }
.apr { display: grid; grid-template-columns: 22px repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; align-items: end; padding: 8px 0; border-top: 1px solid var(--line); }
.apr .n { font-family: var(--font-display); font-weight: 600; color: var(--muted); align-self: center; }
.rtex { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
.rtn { font-family: var(--font-display); color: var(--muted); font-weight: 600; }
.rtname { min-width: 0; overflow-wrap: anywhere; }
.pre { white-space: pre-wrap; margin: 0; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
.rtbtn { display: inline-flex; }
.rtbtn .ico { width: 36px; height: 40px; font-size: 16px; }
details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }
#restbar .rl { min-width: 0; max-width: 36%; }
#restbar .rn { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.9; }
#restbar .time { min-width: 0; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
#nav .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
#nav button { font: inherit; font-size: 11.5px; font-weight: 600; min-height: 52px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
#nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav button[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }
#restbar {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 19;
  max-width: 696px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 10px 8px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.25);
}
#restbar .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; }
#restbar .time { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1; flex: 1; }
#restbar .time.msg { font-size: 18px; }
#restbar button { font: inherit; font-weight: 600; font-size: 14px; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(127,127,127,0.5); background: transparent; color: inherit; cursor: pointer; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>

<div class="wrap">
  <header class="top"><div class="brand">Журнал тренировок</div><div class="sync" id="sync" data-s="local">Только на этом устройстве</div></header>

</div>

<nav id="nav" aria-label="Разделы"><div class="in">

  <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>История</button>

  <button data-act="tab" data-tab="manage"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Программа</button>
</div></nav>

  }
  function parseProgram(txt) {

  function exKey(x) { return normName(x.name) + '|' + x.lo + '-' + x.hi + '|' + x.kind + x.wtype + x.perSide + '|' + x.approaches.map(function (a) { return a.w + (a.warm ? 'р' + a.r : ''); }).join(','); }

  function move(arr, i, d) { var j = i + d; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
